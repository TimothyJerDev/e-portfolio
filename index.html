<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timothy Jernigan</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://kit.fontawesome.com/58ca7702b1.js" crossorigin="anonymous"></script>
</head>
<body>
  <section id="about-me">
    <nav>
      <div class="personal__logo">Timothy Jernigan</div>
      <ul class="nav__link--list">
        <li>
          <a href="" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black
          ">languages</a>
        </li>
        <li>
          <a href="" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black
          ">Projects</a>
        </li>
        <li>
          <a href="" class="
          nav__link--anchor
          nav__link--anchor-primary
          ">Contact</a>
        </li>
      </ul>
    </nav>
    <div class="flex flex-1">
      <div class="about-me__info row">
        <div class="about-me__info--container">
          <figure class="about-me__picture--mask">
            <img src="./assets/me.jpg" class="about-me__picture" alt="picture of me">
          </figure>
          <h1 class="about-me__info--title">
            Hello! I'm <span class="text--color">Timothy Jernigan </span>&nbsp;<span class="wave">👋</span>
          </h1>
            <p class="about-me__info--para">
              I'm a <strong class="text--color">frontend software developer</strong> I make clean and easy to navigate web applications.
            </p>
            <div>
              <a href="" class="about-me__links">
                <i class="fa-brands fa-linkedin"></i>
              </a>
              <a href="" class="about-me__links">
                <i class="fa-brands fa-github"></i>
              </a>
              <a href="" class="about-me__links">
                <i class="fa-brands fa-js"></i>
              </a>
              <a href="" class="about-me__links">
                <i class="fa-solid fa-envelope"></i>
              </a>
            </div>
        </div>
        <figure class="about-me__img--container">
          <img src="./assets/undraw_websites.svg" class="about-me__img" alt="about me">
        </figure>
      </div>
    </div>
  </section>
  <section id="languages">
    <div class="container">
      <div class="row">
        <h1 class="section__title">This is my <span class="text--color">technology stack</span></h1>
        <div class="language__list">
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="https://upload.wikimedia.org/wikipedia/commons/3/38/HTML5_Badge.svg" alt="" class="language__img">
            </figure>
            <span class="language__name">HTML</span>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="https://cdn.iconscout.com/icon/free/png-256/css-131-722685.png" alt="" class="language__img">
            </figure>
            <span class="language__name">CSS</span>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="https://cdn.iconscout.com/icon/free/png-256/javascript-1-225993.png" alt="" class="language__img">
            </figure>
            <span class="language__name">JS</span>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="https://cdn.iconscout.com/icon/free/png-256/react-3-1175109.png" alt="" class="language__img">
            </figure>
            <span class="language__name">React</span>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section id="Project">
    <div class="container">
      <div class="row">
        <h1 class="section__title">Here are some of my <span class="text--color">projects</span></h1>
        <ul class="project__list">
          <li class="project__class">
            <div class="project__wrapper">
              <img class="project__img" src="./assets/loopit.png" alt="">
            </div>
          </li>
        </ul>
      </div>
    </div>
  </section>
</body>
</html>
